<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>NEXUS Logo</title>
  <desc>Logo pour l'application NEXUS, plateforme de gestion de communauté gaming</desc>
  <defs>
    <style>
      .nex-title { font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; font-size: 88px; letter-spacing: 18px; fill: #E8E8FF; }
      .nex-sub { font-family: 'Arial', sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 5px; fill: #8888BB; }
      .glow-line { stroke: #7C5CFC; stroke-width: 1.5; fill: none; opacity: 0.7; }
      .node-outer { fill: none; stroke: #7C5CFC; stroke-width: 1.5; }
      .node-inner { fill: #7C5CFC; }
      .node-core { fill: #C084FC; }
      .hex-stroke { fill: none; stroke: #5B3FD9; stroke-width: 1.5; }
      .hex-fill { fill: #1A1035; opacity: 0.0; }
      .accent { fill: #C084FC; }
      .edge-bright { stroke: #A78BFA; stroke-width: 2; fill: none; opacity: 0.9; }
      .edge-dim { stroke: #4C3A99; stroke-width: 1; fill: none; opacity: 0.6; }
      .diamond { fill: #7C5CFC; }
    </style>
  </defs>

  <!-- HEXAGONE CENTRAL -->
  <g transform="translate(340, 185)">
    <polygon points="0,-90 77.9,-45 77.9,45 0,90 -77.9,45 -77.9,-45" class="hex-stroke" opacity="0.5"/>
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" class="hex-stroke" opacity="0.35"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#2A1A6A" stroke="#7C5CFC" stroke-width="1.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#C084FC" letter-spacing="2">N</text>
    <circle cx="0" cy="-52" r="4" class="node-core"/>
    <circle cx="45" cy="-26" r="4" class="node-core"/>
    <circle cx="45" cy="26" r="4" class="node-core"/>
    <circle cx="0" cy="52" r="4" class="node-core"/>
    <circle cx="-45" cy="26" r="4" class="node-core"/>
    <circle cx="-45" cy="-26" r="4" class="node-core"/>
    <circle cx="0" cy="-90" r="3" fill="#7C5CFC" opacity="0.7"/>
    <circle cx="77.9" cy="-45" r="3" fill="#7C5CFC" opacity="0.7"/>
    <circle cx="77.9" cy="45" r="3" fill="#7C5CFC" opacity="0.7"/>
    <circle cx="0" cy="90" r="3" fill="#7C5CFC" opacity="0.7"/>
    <circle cx="-77.9" cy="45" r="3" fill="#7C5CFC" opacity="0.7"/>
    <circle cx="-77.9" cy="-45" r="3" fill="#7C5CFC" opacity="0.7"/>
  </g>

  <!-- RÉSEAU DE CONNEXIONS -->
  <line x1="340" y1="95" x2="340" y2="52" class="edge-bright"/>
  <line x1="340" y1="52" x2="280" y2="22" class="edge-dim"/>
  <line x1="340" y1="52" x2="400" y2="22" class="edge-dim"/>
  <line x1="340" y1="275" x2="340" y2="318" class="edge-bright"/>
  <line x1="340" y1="318" x2="280" y2="348" class="edge-dim"/>
  <line x1="340" y1="318" x2="400" y2="348" class="edge-dim"/>
  <line x1="262.1" y1="140" x2="230" y2="118" class="edge-bright"/>
  <line x1="230" y1="118" x2="196" y2="100" class="edge-dim"/>
  <line x1="262.1" y1="230" x2="230" y2="252" class="edge-bright"/>
  <line x1="230" y1="252" x2="196" y2="270" class="edge-dim"/>
  <line x1="417.9" y1="140" x2="450" y2="118" class="edge-bright"/>
  <line x1="450" y1="118" x2="484" y2="100" class="edge-dim"/>
  <line x1="417.9" y1="230" x2="450" y2="252" class="edge-bright"/>
  <line x1="450" y1="252" x2="484" y2="270" class="edge-dim"/>
  <circle cx="280" cy="22" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="400" cy="22" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="280" cy="348" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="400" cy="348" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="196" cy="100" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="196" cy="270" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="484" cy="100" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="484" cy="270" r="5" fill="#5B3FD9" stroke="#A78BFA" stroke-width="1"/>
  <line x1="280" y1="22" x2="196" y2="100" class="edge-dim"/>
  <line x1="400" y1="22" x2="484" y2="100" class="edge-dim"/>
  <line x1="280" y1="348" x2="196" y2="270" class="edge-dim"/>
  <line x1="400" y1="348" x2="484" y2="270" class="edge-dim"/>
  <circle cx="230" cy="118" r="3" fill="#7C5CFC" opacity="0.6"/>
  <circle cx="230" cy="252" r="3" fill="#7C5CFC" opacity="0.6"/>
  <circle cx="450" cy="118" r="3" fill="#7C5CFC" opacity="0.6"/>
  <circle cx="450" cy="252" r="3" fill="#7C5CFC" opacity="0.6"/>

  <!-- TEXTE NEXUS -->
  <text x="340" y="420" text-anchor="middle" class="nex-title">NEXUS</text>
  <line x1="200" y1="432" x2="480" y2="432" stroke="#5B3FD9" stroke-width="1" opacity="0.6"/>
  <polygon points="200,432 206,437 200,442 194,437" class="diamond" opacity="0.8"/>
  <polygon points="480,432 486,437 480,442 474,437" class="diamond" opacity="0.8"/>
  <text x="340" y="468" text-anchor="middle" class="nex-sub">GAMING COMMUNITY</text>

</svg>
